<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Assignment 5 - Event Listeners</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>JavaScript Event Listeners</h1>
    <p class="subtitle">DOM Assignment #5</p>
    <section>
        <h2>Task 1: Button Click Event</h2>
        <button id="clickBtn">Click Me</button>
    </section>
    <section>
        <h2>Task 2: Change Text on Click</h2>
        <p id="textPara">This is the original paragraph text.</p>
        <button id="changeTextBtn">Change Text</button>
    </section>
    <section>
        <h2>Task 3: Background Color Change</h2>
        <button id="backgroundBtn">Change Background</button>
    </section>
    <section>
        <h2>Task 4: Input Event</h2>
        <input type="text" id="userInput" placeholder="Type something here">
        <p id="outputText">Your typed text will appear here.</p>
    </section>
    <section>
        <h2>Task 5: Mouse Events</h2>
        <div id="colorBox">Hover Over Me</div>
    </section>
    <section>
        <h2>Task 6: Double Click Event</h2>
        <button id="doubleClickBtn">Double Click Me</button>
    </section>
</div>
<script src="script.js"></script>
</body>
</html>
