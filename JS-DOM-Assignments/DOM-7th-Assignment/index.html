<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My To-Do APP</h1>

    <div class="box">
        <div>
            <input type="text" id="input-field" placeholder="Enter Your Today's Task">
            <button id="inpBtn">Add Item</button>
        </div>

        <div>
            <ul id="ul-list"></ul>
        </div>

        <button id="clearBtn">Clear All</button>

        <p id="counter">Total Tasks: 0</p>
    </div>

</body>
<script src="Script.js"></script>
</html>
